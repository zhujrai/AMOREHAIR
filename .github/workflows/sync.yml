name: Mirror to Zhujrai

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to mirror repository
        run: |
          git remote add mirror https://${{ secrets.SYNC_TOKEN }}@github.com/zhujrai/AMOREHAIR.git
          git push --force mirror main
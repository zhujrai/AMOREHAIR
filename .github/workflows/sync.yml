name: Mirror to Zhujrai

on:
  push:
    branches:
      - main # O la rama principal que uses (ej. master)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to mirror repository
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git remote add mirror https://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@github.com/zhujrai/AMOREHAIR.git
          git push --force mirror main
